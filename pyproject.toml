[project]
name = "maitrace"
version = "6.2.4"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSES/MaiTrace-legacy-MIT.txt", "LICENSES/message-reader-MIT.txt", "LICENSES/activity-history-MIT.txt"]
description = "麦时迹：MaiBot 内部日程、生活状态、素材与 QQ 空间"
requires-python = ">=3.12"
dependencies = [
    "maibot-plugin-sdk>=2.15.0,<3",
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
    "json5>=0.9.0",
    "tzdata>=2024.1",
    "chinese-calendar>=1.11.0",
    "lunar-python>=1.4.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
